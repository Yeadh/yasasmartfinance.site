<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yasa Smart Finances</title>
  <meta name="description" content="Simple tools to track your money, budget and savings.">
  <style>
    :root {
      --bg: #f3f6f2;
      --ink: #12261f;
      --muted: #55685f;
      --accent: #0f6b4f;
      --line: #cfd9d2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1a15;
        --ink: #e8f0ea;
        --muted: #9db0a5;
        --accent: #5fd0a3;
        --line: #26382f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans Bengali", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }
    header, main, footer { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 24px; }
    header { padding-top: 28px; font-weight: 700; letter-spacing: .01em; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 40px; }
    h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.1;
      font-weight: 800;
      max-width: 14ch;
    }
    p { margin-top: 20px; max-width: 46ch; color: var(--muted); font-size: 1.1rem; }
    a.button {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 22px;
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
      width: fit-content;
    }
    a.button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    footer { padding-top: 16px; padding-bottom: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <header>Yasa Smart Finances</header>
  <main>
    <h1>Know where your money goes.</h1>
    <p>Track expenses, set budgets and reach your savings goals. The app is being built and will be live here soon.</p>
    <a class="button" href="mailto:hello@yasasmartfinances.site">Contact us</a>
  </main>
  <footer>&copy; 2026 yasasmartfinances.site</footer>
</body>
</html>
